services:
  postgres:
    image: postgres:16
    container_name: finguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finguard_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard} -d ${POSTGRES_DB:-finguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: finguard_kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Only the HOST listener is published -- this is the address the
      # generator CLI, tests, and any other host-side client connect to
      # (matches the KAFKA_BOOTSTRAP_SERVERS=localhost:9092 default used
      # throughout src/streaming and tests/integration).
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # KRaft mode -- no Zookeeper. A single node acts as both broker and
      # controller, which is the simplest topology that's still "real" KRaft
      # (not a special single-process shortcut) -- see docs/kafka.md for the
      # local-vs-production comparison (production: separate controller
      # quorum, 3+ brokers, replication factor 3).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Three listeners, deliberately separated:
      #   CONTROLLER (9093) - KRaft controller-quorum traffic only.
      #   PLAINTEXT (19092) - internal, container-to-container traffic (the
      #     address other services on the compose network, e.g. a future
      #     Spark container in Phase 3, would use: kafka:19092). NOT
      #     published to the host.
      #   HOST (9092) - the only listener published to the host machine,
      #     advertised as localhost:9092 so host-side clients resolve it
      #     correctly.
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,PLAINTEXT://0.0.0.0:19092,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created explicitly, see scripts/create_kafka_topics.py
    volumes:
      - finguard_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: finguard_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finguard_prometheus_data:/prometheus
    # scrapes the `api` service's /metrics endpoint (see monitoring/prometheus.yml)
    # -- NOT run end-to-end in this sandbox (no Docker daemon); see
    # docs/observability.md §5 for what WAS verified instead (the /metrics
    # endpoint itself, via FastAPI's TestClient, tests/integration/test_metrics.py).
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    container_name: finguard_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - finguard_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: finguard_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres  # container-to-container hostname, not localhost -- see docs/kafka.md §1
      # for the same host-vs-internal-listener distinction applied to Postgres here
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ML_MLFLOW_TRACKING_URI: ${ML_MLFLOW_TRACKING_URI:-sqlite:///data/mlflow/mlflow.db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finguard_postgres_data:
  finguard_kafka_data:
  finguard_prometheus_data:
  finguard_grafana_data:
